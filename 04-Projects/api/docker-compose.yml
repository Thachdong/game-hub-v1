services:
  pgsql:
    image: postgres:16-alpine
    container_name: game_hub_pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-game_hub}
      POSTGRES_USER: ${POSTGRES_USER:-game_hub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_hub_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game_hub_user} -d ${POSTGRES_DB:-game_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: game_hub_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gamehub.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      pgsql:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${API_TARGET:-runtime}
    image: game-hub-api:${API_TARGET:-runtime}
    container_name: game_hub_api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      # Override the host-oriented DATABASE_URL from .env so the API reaches
      # Postgres via the compose network instead of localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-game_hub_user}:${POSTGRES_PASSWORD:-game_hub_pass}@pgsql:5432/${POSTGRES_DB:-game_hub}
    ports:
      - "${API_PORT:-3000}:${PORT:-3000}"
    depends_on:
      pgsql:
        condition: service_healthy

volumes:
  pgsql_data:
  pgadmin_data:
