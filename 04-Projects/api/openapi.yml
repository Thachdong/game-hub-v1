        active:
          type: boolean
          example: true
        createdAt:
          format: date-time
          type: string
          example: '2026-06-01T00:00:00.000Z'
        updatedAt:
          format: date-time
          type: string
          example: '2026-06-30T10:00:00.000Z'
      required:
