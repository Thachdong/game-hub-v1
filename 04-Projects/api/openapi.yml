        gameLockedUntil:
          type: object
          example: null
          nullable: true
        lastRecoveryDate:
          type: object
          example: '2026-06-29'
          nullable: true
        updatedAt:
          format: date-time
          type: string
          example: '2026-06-30T10:00:00.000Z'
