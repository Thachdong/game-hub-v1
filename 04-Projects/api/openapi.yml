info:
  title: Game Hub API
  description: Account & Social Module
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ApiResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 200
          description: Internal status code (mirrors HTTP status)
        data:
          type: object
          description: Response payload, shape varies per endpoint
        message:
          type: string
          example: Success
          description: Human-readable message
      required:
        - statusCode
        - data
        - message
    AccountInResponseDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
      required:
        - id
        - email
        - username
        - avatarUrl
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        account:
          $ref: '#/components/schemas/AccountInResponseDto'
      required:
        - accessToken
        - refreshToken
        - account
    RefreshResponseDto:
      type: object
      properties:
        accessToken:
          type: string
      required:
        - accessToken
    RefreshRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    AccountProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
      required:
        - id
        - email
        - username
        - avatarUrl
    GameEntryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        hasProfile:
          type: boolean
      required:
        - id
        - name
        - slug
    GameListResponseDto:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameEntryDto'
      required:
        - games
    FriendRequestRecordDto:
      type: object
      properties:
        id:
          type: string
        senderId:
          type: string
        receiverId:
          type: string
        status:
          type: string
        createdAt:
          format: date-time
          type: string
        resolvedAt:
          type: object
          nullable: true
      required:
        - id
        - senderId
        - receiverId
        - status
        - createdAt
    SendFriendRequestDto:
      type: object
      properties:
        targetEmail:
          type: string
      required:
        - targetEmail
    FriendRequestsResponseDto:
      type: object
      properties:
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/FriendRequestRecordDto'
        outgoing:
          type: array
          items:
            $ref: '#/components/schemas/FriendRequestRecordDto'
      required:
        - incoming
        - outgoing
    ResolveFriendRequestDto:
      type: object
      properties:
        action:
          type: string
          enum:
            - accept
            - reject
      required:
        - action
    FriendProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
      required:
        - id
        - email
        - username
        - avatarUrl
    FriendsResponseDto:
      type: object
      properties:
        friends:
          type: array
          items:
            $ref: '#/components/schemas/FriendProfileDto'
      required:
        - friends
    GameAdminRoleRecordDto:
      type: object
      properties:
        accountId:
          type: string
        gameId:
          type: string
        grantedAt:
          format: date-time
          type: string
      required:
        - accountId
        - gameId
        - grantedAt
    AssignGameAdminDto:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
      required:
        - accountId
    NotificationEntryDto:
      type: object
      properties:
        id:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type:
          type: string
          example: friend-or-game-invite
          enum:
            - friend-or-game-invite
            - tournament-event
            - admin-warning
            - trust-score-alert
        content:
          type: string
          example: Alice sent you a friend request.
        referenceId:
          type: object
          example: null
          nullable: true
        isRead:
          type: boolean
          example: false
        createdAt:
          type: string
          example: '2026-06-29T10:00:00.000Z'
      required:
        - id
        - type
        - content
        - referenceId
        - isRead
        - createdAt
    NextCursorDto:
      type: object
      properties:
        createdAt:
          type: string
          example: '2026-06-29T09:59:00.000Z'
        id:
          type: string
          example: 4ab85f64-5717-4562-b3fc-2c963f66afa7
      required:
        - createdAt
        - id
    NotificationListResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEntryDto'
        nextCursor:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/NextCursorDto'
      required:
        - items
        - nextCursor
    MarkReadResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type:
          type: string
          example: friend-or-game-invite
          enum:
            - friend-or-game-invite
            - tournament-event
            - admin-warning
            - trust-score-alert
        content:
          type: string
          example: Alice sent you a friend request.
        referenceId:
          type: object
          example: null
          nullable: true
        isRead:
          type: boolean
          example: true
        createdAt:
          type: string
          example: '2026-06-29T10:00:00.000Z'
      required:
        - id
        - type
        - content
        - referenceId
        - isRead
        - createdAt
    PlayerReportTypeDto:
      type: object
      properties:
        id:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        name:
          type: string
          example: cheating
      required:
        - id
        - name
    PlayerReportTypeListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlayerReportTypeDto'
      required:
        - items
    SubmitReportDto:
      type: object
      properties:
        reportedUserId:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        reportTypeId:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        context:
          type: string
          example: 'Used an aim-assist tool during ranked match #4821.'
          minLength: 1
          maxLength: 2000
      required:
        - reportedUserId
        - reportTypeId
        - context
    SubmitReportResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 5e2c1a0e-2f1e-4d3b-9a8b-1c2d3e4f5a6b
        reportedUserId:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        reportTypeId:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        context:
          type: string
          example: 'Used an aim-assist tool during ranked match #4821.'
        status:
          type: string
          example: pending
        submittedAt:
          format: date-time
          type: string
          example: '2026-06-30T10:00:00.000Z'
      required:
        - id
        - reportedUserId
        - reportTypeId
        - context
        - status
        - submittedAt
    AdminReportEntryDto:
      type: object
      properties:
        id:
          type: string
          example: 5e2c1a0e-2f1e-4d3b-9a8b-1c2d3e4f5a6b
        reporterId:
          type: string
          example: 11111111-1111-1111-1111-111111111111
        reportedUserId:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        reportTypeId:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        context:
          type: string
          example: 'Used an aim-assist tool during ranked match #4821.'
        status:
          type: string
          example: pending
          enum:
            - pending
            - valid
            - invalid
        appliedPoints:
          type: object
          example: 20
          nullable: true
        submittedAt:
          format: date-time
          type: string
          example: '2026-06-30T10:00:00.000Z'
        resolvedAt:
          type: object
          example: '2026-06-30T11:00:00.000Z'
          nullable: true
        resolvedBy:
          type: object
          example: 22222222-2222-2222-2222-222222222222
          nullable: true
      required:
        - id
        - reporterId
        - reportedUserId
        - reportTypeId
        - context
        - status
        - submittedAt
    AdminListReportsResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminReportEntryDto'
        nextCursor:
          type: object
          nullable: true
      required:
        - items
    ReviewReportDto:
      type: object
      properties:
        decision:
          type: string
          enum:
            - valid
            - invalid
          example: valid
      required:
        - decision
    TrustScoreSnapshotDto:
      type: object
      properties:
        score:
          type: number
          example: 45
        locked:
          type: boolean
          example: false
        lockedUntil:
          type: object
          example: null
          nullable: true
      required:
        - score
        - locked
    ConfirmReportResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 5e2c1a0e-2f1e-4d3b-9a8b-1c2d3e4f5a6b
        status:
          type: string
          enum:
            - valid
            - invalid
        appliedPoints:
          type: object
          example: 20
          nullable: true
        resolvedAt:
          format: date-time
          type: string
          example: '2026-06-30T11:00:00.000Z'
        resolvedBy:
          type: string
          example: 22222222-2222-2222-2222-222222222222
        reportedUserTrustScore:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TrustScoreSnapshotDto'
