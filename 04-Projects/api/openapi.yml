openapi: 3.0.0
paths:
  /api/auth/google:
    get:
      operationId: AuthController_googleLogin
      summary: Initiate Google OAuth login
      parameters: []
      responses:
        '302':
          description: Redirect to Google consent page
      tags:
        - Auth
  /api/auth/google/callback:
    get:
      operationId: AuthController_googleCallback
      summary: Google OAuth callback
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginResponseDto'
        '503':
          description: Google OAuth unavailable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 503
                      data:
                        nullable: true
                        example: null
      tags:
        - Auth
  /api/auth/refresh:
    post:
      operationId: AuthController_refresh
      summary: Refresh access token
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RefreshResponseDto'
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 400
                      data:
                        nullable: true
                        example: null
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 401
                      data:
                        nullable: true
                        example: null
      tags:
        - Auth
      security:
        - bearer: []
  /api/accounts/me:
    get:
      operationId: AccountController_getMe
      summary: Get authenticated account profile
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AccountProfileDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 401
                      data:
                        nullable: true
                        example: null
      tags:
        - Account
      security:
        - bearer: []
  /api/games:
    get:
      operationId: GamesController_list
      summary: List all games, with hasProfile flag when authenticated
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/GameListResponseDto'
      tags:
        - Games
      security:
        - bearer: []
  /api/friends/requests:
    post:
      operationId: FriendsController_sendRequest
      summary: Send a friend request by target email
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFriendRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/FriendRequestRecordDto'
        '400':
          description: Self-request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 400
                      data:
                        nullable: true
                        example: null
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 404
                      data:
                        nullable: true
                        example: null
        '409':
          description: Duplicate or already friends
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 409
                      data:
                        nullable: true
                        example: null
      tags:
        - Friends
      security:
        - bearer: []
    get:
      operationId: FriendsController_listRequests
      summary: Get incoming and outgoing pending friend requests
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/FriendRequestsResponseDto'
      tags:
        - Friends
      security:
        - bearer: []
  /api/friends/requests/{id}:
    patch:
      operationId: FriendsController_resolve
      summary: Accept or reject a friend request
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveFriendRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/FriendRequestRecordDto'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 403
                      data:
                        nullable: true
                        example: null
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 404
                      data:
                        nullable: true
                        example: null
        '409':
          description: Already friends
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 409
                      data:
                        nullable: true
                        example: null
      tags:
        - Friends
      security:
        - bearer: []
  /api/friends:
    get:
      operationId: FriendsController_list
      summary: List friends
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/FriendsResponseDto'
      tags:
        - Friends
      security:
        - bearer: []
  /api/admin/games/{gameId}/admins:
    post:
      operationId: AdminController_assign
      summary: Assign Game Admin role
      parameters:
        - name: gameId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignGameAdminDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/GameAdminRoleRecordDto'
        '403':
          description: Requires Platform Admin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 403
                      data:
                        nullable: true
                        example: null
        '404':
          description: Account or game not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 404
                      data:
                        nullable: true
                        example: null
      tags:
        - Admin
      security:
        - bearer: []
  /api/admin/games/{gameId}/admins/{accountId}:
    delete:
      operationId: AdminController_revoke
      summary: Revoke Game Admin role
      parameters:
        - name: gameId
          required: true
          in: path
          schema:
            type: string
        - name: accountId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Role revoked (no body)
        '403':
          description: Requires Platform Admin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 403
                      data:
                        nullable: true
                        example: null
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 404
                      data:
                        nullable: true
                        example: null
      tags:
        - Admin
      security:
        - bearer: []
  /api/notifications:
    get:
      operationId: NotificationsController_list
      summary: Get authenticated player notification list (newest first)
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 20
            example: 20
            type: number
        - name: cursorCreatedAt
          required: false
          in: query
          schema:
            example: '2026-06-29T09:59:00.000Z'
            type: string
        - name: cursorId
          required: false
          in: query
          schema:
            example: 4ab85f64-5717-4562-b3fc-2c963f66afa7
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/NotificationListResponseDto'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 400
                      data:
                        nullable: true
                        example: null
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 401
                      data:
                        nullable: true
                        example: null
      tags:
        - Notifications
      security:
        - bearer: []
  /api/notifications/{id}/read:
    patch:
      operationId: NotificationsController_markRead
      summary: Mark a notification as read (idempotent)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MarkReadResponseDto'
        '400':
          description: Invalid UUID format
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 400
                      data:
                        nullable: true
                        example: null
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 401
                      data:
                        nullable: true
                        example: null
        '403':
          description: Notification belongs to a different user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 403
                      data:
                        nullable: true
                        example: null
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 404
                      data:
                        nullable: true
                        example: null
      tags:
        - Notifications
      security:
        - bearer: []
  /api/report-types:
    get:
      operationId: ReportTypesController_list
      summary: List active report types available for submission
      parameters: []
      responses:
        '200':
          description: Active report types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerReportTypeListDto'
        '401':
          description: Unauthorized
      tags:
        - Report Types
      security:
        - bearer: []
  /api/reports:
    post:
      operationId: ReportsController_submit
      summary: Submit a report against another user
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReportDto'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitReportResponseDto'
        '400':
          description: Self-report or validation error
        '401':
          description: Unauthorized
        '404':
          description: Account or report type not found
        '422':
          description: Report type is inactive
      tags:
        - Reports
      security:
        - bearer: []
  /api/admin/reports:
    get:
      operationId: AdminReportsController_list
      summary: List reports (admin view, cursor-paginated)
      parameters:
        - name: status
          required: false
          in: query
          schema:
            enum:
              - pending
              - valid
              - invalid
            type: string
        - name: limit
          required: false
          in: query
          schema:
            type: number
        - name: cursorSubmittedAt
          required: false
          in: query
          schema:
            type: string
        - name: cursorId
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListReportsResponseDto'
        '400':
          description: Partial cursor provided
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not a Platform Admin
      tags:
        - Admin — Reports
      security:
        - bearer: []
  /api/admin/reports/{id}/confirm:
    patch:
      operationId: AdminReportsController_confirm
      summary: Confirm a pending report as valid or invalid
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReportDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmReportResponseDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not a Platform Admin
        '404':
          description: Report not found
        '409':
          description: Report already resolved
      tags:
        - Admin — Reports
      security:
        - bearer: []
  /api/admin/report-types:
    get:
      operationId: AdminReportTypesController_list
      summary: List all report types including inactive (admin view)
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListReportTypesResponseDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not a Platform Admin
      tags:
        - Admin — Report Types
      security:
        - bearer: []
    post:
      operationId: AdminReportTypesController_create
      summary: Create a new report type
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportTypeDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportTypeEntryDto'
        '400':
          description: Invalid deduction points
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not a Platform Admin
        '409':
          description: Name already taken
      tags:
        - Admin — Report Types
      security:
        - bearer: []
  /api/admin/report-types/{id}:
    patch:
      operationId: AdminReportTypesController_update
      summary: Update a report type (name, deductionPoints, active)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportTypeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportTypeEntryDto'
        '400':
          description: Empty update or invalid points
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not a Platform Admin
        '404':
          description: Report type not found
        '409':
          description: Name already taken
      tags:
        - Admin — Report Types
      security:
        - bearer: []
    delete:
      operationId: AdminReportTypesController_deactivate
      summary: Deactivate a report type (idempotent soft-delete)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Deactivated or already inactive
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not a Platform Admin
        '404':
          description: Report type not found
      tags:
        - Admin — Report Types
      security:
        - bearer: []
  /api/trust-score/me:
    get:
      operationId: TrustScoreController_getMyScore
      summary: Get my trust score and lock status
      parameters: []
      responses:
        '200':
          description: Trust score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustScoreResponseDto'
        '401':
          description: Unauthorized
      tags:
        - Trust Score
      security:
        - bearer: []
  /api/admin/caro/game-configs:
    post:
      operationId: AdminGameConfigsController_create
      summary: Create a new game configuration
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameConfigDto'
      responses:
        '201':
          description: Config created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminGameConfigDto'
        '400':
          description: Invalid board size or move time
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 400
                      data:
                        nullable: true
                        example: null
        '401':
          description: Missing or expired JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 401
                      data:
                        nullable: true
                        example: null
        '403':
          description: Not a Caro Game Admin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 403
                      data:
                        nullable: true
                        example: null
        '409':
          description: Active config with this combo already exists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 409
                      data:
                        nullable: true
                        example: null
      tags:
        - Admin — Caro Game Configs
      security:
        - bearer: []
    get:
      operationId: AdminGameConfigsController_listAll
      summary: List all game configurations including inactive
      parameters: []
      responses:
        '200':
          description: All configs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminListGameConfigsResponseDto'
        '401':
          description: Missing or expired JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 401
                      data:
                        nullable: true
                        example: null
        '403':
          description: Not a Caro Game Admin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 403
                      data:
                        nullable: true
                        example: null
      tags:
        - Admin — Caro Game Configs
      security:
        - bearer: []
  /api/admin/caro/game-configs/{id}:
    patch:
      operationId: AdminGameConfigsController_update
      summary: Update board size and/or move time of a configuration
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameConfigDto'
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminGameConfigDto'
        '400':
          description: Invalid enum value or empty body
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 400
                      data:
                        nullable: true
                        example: null
        '401':
          description: Missing or expired JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 401
                      data:
                        nullable: true
                        example: null
        '403':
          description: Not a Caro Game Admin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 403
                      data:
                        nullable: true
                        example: null
        '404':
          description: Config not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 404
                      data:
                        nullable: true
                        example: null
        '409':
          description: Active config with this combo already exists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 409
                      data:
                        nullable: true
                        example: null
      tags:
        - Admin — Caro Game Configs
      security:
        - bearer: []
    delete:
      operationId: AdminGameConfigsController_deactivate
      summary: Deactivate (soft-delete) a game configuration
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Deactivated — no content
        '401':
          description: Missing or expired JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 401
                      data:
                        nullable: true
                        example: null
        '403':
          description: Not a Caro Game Admin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 403
                      data:
                        nullable: true
                        example: null
        '404':
          description: Config not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      statusCode:
                        example: 404
                      data:
                        nullable: true
                        example: null
      tags:
        - Admin — Caro Game Configs
