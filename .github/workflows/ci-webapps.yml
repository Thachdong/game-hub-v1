name: CI - Webapps

on:
  pull_request:
    branches:
      - develop-webapps
    paths:
      - '04-Projects/webapps/**'
      - '.github/workflows/ci-webapps.yml'

concurrency:
  group: ci-webapps-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-Projects/webapps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 04-Projects/webapps/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
